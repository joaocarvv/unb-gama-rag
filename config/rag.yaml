# Configuração central do RAG da equipe 09.
# Os scripts leem tudo daqui. Valores marcados como null serão definidos no passo indicado.

caminhos:
  catalogo: catalogo/fontes.csv
  entidades: config/entidades.yaml
  originais: data/originais
  fichas: data/fichas/records.json
  extraido: data/extraido
  chunks: data/chunks/chunks.jsonl
  chunks_rascunho: data/chunks/chunks_rascunho.jsonl   # pendentes tratadas como aprovadas, fora do git
  chroma: data/index/chroma
  manifesto: data/index/manifesto.json
  chroma_rascunho: data/index/chroma_rascunho          # índice das pendentes, nunca mistura com o real
  manifesto_rascunho: data/index/manifesto_rascunho.json
  execucoes: execucoes

catalogo:
  status_validos: [aprovado, pendente, rejeitado]
  abrangencias_validas: [Gama, UnB geral, DF]
  tipos_validos: [pagina_web, pdf, ficha]
  validade_desconhecida: desconhecida
  meta_aprovados: 20

aquisicao:
  user_agent: "unb-gama-rag/0.1 (projeto academico, Residencia em IA, UnB Gama)"
  timeout_s: 30
  pausa_s: 2               # espera entre downloads para não sobrecarregar os sites
  status_ignorados: [rejeitado]
  fuso_horario: America/Sao_Paulo   # define a data da coleta (versão)

extracao:
  conteudo_padrao: main    # seletor CSS da área de conteúdo (sites WordPress/Elementor)
  remover_padrao: [script, style, noscript, svg, iframe, form, nav, header, footer, aside, button]
  titulos_extras: [".elementor-tab-title"]   # títulos de abas (sanfonas) viram título de seção
  min_palavras: 50         # abaixo disso, avisa que a página tem pouco texto
  por_site:                # regras específicas por domínio
    dfnoponto.semob.df.gov.br:
      conteudo: "#ajax-content-wrap"
      remover: ["#header-outer", "#search-outer", "#footer1", "#footer2", "#slide-out-widget-area"]
  por_fonte: {}            # remoções pontuais, ex.: trecho de outro campus
                           # DOC-000: {remover: [".seletor"]}

embeddings:
  modelo: intfloat/multilingual-e5-small
  revisao: 614241f622f53c4eeff9890bdc4f31cfecc418b3   # commit no Hugging Face (modelo e tokenizer)
  dimensao: 384
  max_tokens: 512
  prefixo_documento: "passage: "
  prefixo_pergunta: "query: "
  normalizar: true
  lote: 32                 # quantos textos codificar por vez
  dispositivo: cpu

chunking:
  # agrupar_irmaos (opção C): junta seções vizinhas com o mesmo título-pai até o alvo
  # por_secao (opção A): uma seção por chunk (seção longa ainda é subdividida)
  estrategia: agrupar_irmaos
  alvo_tokens: 300
  sobreposicao_tokens: 40  # só ao subdividir seção longa
  max_tokens: 512          # inclui prefixo e título

indice:
  colecao: fcte
  distancia: cosine

conferencia:
  # Perguntas só para ver se o índice reaberto responde. Não é avaliação (isso é o passo 6).
  perguntas:
    - Onde fica o Laboratório de Sistemas Espaciais?
    - Onde consultar linhas e horários de ônibus para o campus Gama?
    - Quais auxílios de assistência estudantil existem?
  tolerancia_vetor: 0.0001  # diferença máxima ao recodificar um chunk e comparar com o salvo

busca:
  top_k: 5
  max_por_fonte: 2

geracao:
  provedor: gemini
  modelo: null             # passo 7
  temperatura: null        # passo 7 (baixa)
